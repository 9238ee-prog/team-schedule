<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="팀 스케줄">
<meta name="theme-color" content="#1a73e8">
<title>팀 스케줄</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --primary: #1a73e8;
  --primary-dark: #1557b0;
  --bg: #f8f9fa;
  --card: #ffffff;
  --text: #202124;
  --text-sub: #5f6368;
  --border: #e0e0e0;
  --danger: #d93025;
  --success: #188038;
  --shadow: 0 2px 8px rgba(0,0,0,0.12);
}
body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "맑은 고딕", sans-serif; background: var(--bg); color: var(--text); }

/* 일정 종류 색상 */
.type-연차 { background: #ea4335; }
.type-휴가 { background: #34a853; }
.type-병가 { background: #9c27b0; }
.type-출장 { background: #ff9800; }
.type-회의 { background: #1a73e8; }
.type-교육 { background: #00bcd4; }
.type-기타 { background: #607d8b; }
.dot-연차 { background: #ea4335; }
.dot-휴가 { background: #34a853; }
.dot-병가 { background: #9c27b0; }
.dot-출장 { background: #ff9800; }
.dot-회의 { background: #1a73e8; }
.dot-교육 { background: #00bcd4; }
.dot-기타 { background: #607d8b; }

/* 로그인 */
#loginPage {
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%);
}
.login-box {
  background: white; border-radius: 16px; padding: 40px 32px;
  width: 90%; max-width: 360px; box-shadow: 0 8px 32px rgba(0,0,0,0.2);
}
.login-box h1 { font-size: 24px; margin-bottom: 8px; color: var(--primary); }
.login-box p { color: var(--text-sub); margin-bottom: 28px; font-size: 14px; }
.input-group { margin-bottom: 16px; }
.input-group label { display: block; font-size: 13px; color: var(--text-sub); margin-bottom: 6px; }
.input-group input {
  width: 100%; padding: 12px 14px; border: 1.5px solid var(--border);
  border-radius: 8px; font-size: 15px; outline: none; transition: border 0.2s;
}
.input-group input:focus { border-color: var(--primary); }
.btn-primary {
  width: 100%; padding: 13px; background: var(--primary); color: white;
  border: none; border-radius: 8px; font-size: 16px; font-weight: 600;
  cursor: pointer; transition: background 0.2s;
}
.btn-primary:hover { background: var(--primary-dark); }
.error-msg { color: var(--danger); font-size: 13px; margin-top: 10px; text-align: center; }

/* 앱 레이아웃 */
#app { display: none; flex-direction: column; min-height: 100vh; }
.topbar {
  background: var(--primary); color: white;
  padding: 14px 16px; display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow);
}
.topbar h1 { font-size: 18px; font-weight: 700; }
.topbar-right { display: flex; align-items: center; gap: 10px; }
.user-badge {
  background: rgba(255,255,255,0.2); border-radius: 20px;
  padding: 4px 12px; font-size: 13px;
}
.role-badge {
  background: rgba(255,255,255,0.3); border-radius: 12px;
  padding: 2px 8px; font-size: 11px; font-weight: 600;
}
.btn-icon { background: none; border: none; color: white; cursor: pointer; font-size: 20px; padding: 4px; }

/* 탭 */
.tabs {
  display: flex; background: white; border-bottom: 2px solid var(--border);
  position: sticky; top: 52px; z-index: 99;
}
.tab {
  flex: 1; padding: 12px 4px; text-align: center; font-size: 13px;
  font-weight: 600; color: var(--text-sub); cursor: pointer;
  border-bottom: 3px solid transparent; transition: all 0.2s; border: none; background: none;
}
.tab.active { color: var(--primary); border-bottom-color: var(--primary); }

.content { padding: 16px; max-width: 700px; margin: 0 auto; width: 100%; }

/* 달력 */
.calendar-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px;
}
.calendar-header h2 { font-size: 18px; font-weight: 700; }
.btn-nav {
  background: white; border: 1.5px solid var(--border); border-radius: 8px;
  padding: 6px 12px; cursor: pointer; font-size: 16px; color: var(--text);
}
.cal-grid {
  background: white; border-radius: 12px; overflow: hidden;
  box-shadow: var(--shadow); margin-bottom: 16px;
}
.cal-weekdays {
  display: grid; grid-template-columns: repeat(7, 1fr);
  background: var(--bg); padding: 8px 0;
}
.cal-weekday {
  text-align: center; font-size: 12px; font-weight: 600;
  color: var(--text-sub); padding: 4px 0;
}
.cal-weekday:first-child { color: #d93025; }
.cal-weekday:last-child { color: #1a73e8; }
.cal-days { display: grid; grid-template-columns: repeat(7, 1fr); }
.cal-day {
  min-height: 64px; padding: 4px; border-top: 1px solid var(--border);
  border-right: 1px solid var(--border); cursor: pointer;
  transition: background 0.15s; position: relative;
}
.cal-day:hover { background: #f0f4ff; }
.cal-day.other-month .day-num { color: #ccc; }
.cal-day.today { background: #e8f0fe; }
.cal-day.today .day-num { background: var(--primary); color: white; border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; }
.cal-day.selected { background: #fff3e0; }
.day-num { font-size: 13px; font-weight: 500; margin-bottom: 2px; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; }
.cal-day:nth-child(7n+1) .day-num { color: #d93025; }
.cal-day:nth-child(7n) .day-num { color: #1a73e8; }
.day-events { display: flex; flex-wrap: wrap; gap: 1px; }
.day-dot { width: 6px; height: 6px; border-radius: 50%; }
.day-count { font-size: 10px; color: var(--text-sub); }
.attendance-count {
  font-size: 10px; font-weight: 600;
  position: absolute; bottom: 3px; right: 4px;
}
.attendance-ok { color: var(--success); }
.attendance-low { color: var(--danger); }

/* 범례 */
.legend {
  display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px;
  background: white; padding: 12px; border-radius: 10px; box-shadow: var(--shadow);
}
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

/* 날짜 상세 패널 */
.day-detail {
  background: white; border-radius: 12px; box-shadow: var(--shadow);
  padding: 16px; margin-bottom: 16px; display: none;
}
.day-detail.show { display: block; }
.day-detail h3 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.attendance-info { font-size: 13px; color: var(--text-sub); margin-bottom: 12px; }
.schedule-list { display: flex; flex-direction: column; gap: 8px; }
.schedule-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: 8px; background: var(--bg);
}
.schedule-type-badge {
  color: white; font-size: 11px; font-weight: 700;
  padding: 3px 8px; border-radius: 12px; white-space: nowrap; flex-shrink: 0;
}
.schedule-info { flex: 1; }
.schedule-name { font-size: 14px; font-weight: 600; }
.schedule-note { font-size: 12px; color: var(--text-sub); }
.schedule-status { font-size: 12px; font-weight: 600; }
.status-pending { color: #ff9800; }
.status-approved { color: var(--success); }
.status-rejected { color: var(--danger); }
.btn-approve { background: var(--success); color: white; border: none; border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
.btn-reject { background: var(--danger); color: white; border: none; border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
.btn-delete { background: #9e9e9e; color: white; border: none; border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; }

/* 신청 탭 */
.card {
  background: white; border-radius: 12px; box-shadow: var(--shadow);
  padding: 20px; margin-bottom: 16px;
}
.card h3 { font-size: 16px; font-weight: 700; margin-bottom: 16px; color: var(--primary); }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-sub); margin-bottom: 6px; }
.form-group input, .form-group select, .form-group textarea {
  width: 100%; padding: 11px 13px; border: 1.5px solid var(--border);
  border-radius: 8px; font-size: 14px; outline: none; transition: border 0.2s;
  font-family: inherit;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--primary); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.type-select { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
.type-btn {
  padding: 10px 4px; border: 2px solid var(--border); border-radius: 8px;
  background: white; font-size: 13px; cursor: pointer; text-align: center;
  font-weight: 600; transition: all 0.2s; color: var(--text-sub);
}
.type-btn.selected { border-color: var(--primary); color: var(--primary); background: #e8f0fe; }
.btn-submit {
  width: 100%; padding: 13px; background: var(--primary); color: white;
  border: none; border-radius: 8px; font-size: 15px; font-weight: 700;
  cursor: pointer; transition: background 0.2s;
}
.btn-submit:hover { background: var(--primary-dark); }

/* 내 신청 목록 */
.my-request {
  display: flex; align-items: center; gap: 10px;
  padding: 12px; border-radius: 10px; border: 1.5px solid var(--border);
  margin-bottom: 8px; background: white;
}
.request-dates { font-size: 13px; font-weight: 600; }
.request-sub { font-size: 12px; color: var(--text-sub); }
.btn-cancel { background: #f5f5f5; color: var(--danger); border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer; font-weight: 600; }

/* 관리자 탭 */
.pending-item {
  background: white; border-radius: 10px; padding: 14px;
  box-shadow: var(--shadow); margin-bottom: 10px;
}
.pending-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.pending-name { font-size: 15px; font-weight: 700; }
.pending-detail { font-size: 13px; color: var(--text-sub); margin-bottom: 10px; }
.pending-actions { display: flex; gap: 8px; }
.btn-lg-approve { flex: 1; padding: 10px; background: var(--success); color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; }
.btn-lg-reject { flex: 1; padding: 10px; background: var(--danger); color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; }

/* 구성원 탭 */
.member-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px; background: white; border-radius: 10px;
  box-shadow: var(--shadow); margin-bottom: 8px;
}
.member-info { display: flex; align-items: center; gap: 10px; }
.member-avatar {
  width: 40px; height: 40px; border-radius: 50%; background: var(--primary);
  color: white; display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 16px; flex-shrink: 0;
}
.member-name { font-size: 15px; font-weight: 600; }
.member-email { font-size: 12px; color: var(--text-sub); }
.member-role { font-size: 12px; font-weight: 700; }
.role-master { color: #d93025; }
.role-manager { color: #ff9800; }
.role-member { color: var(--primary); }
.btn-small { padding: 5px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; border: 1.5px solid var(--border); background: white; font-weight: 600; }

/* 모달 */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5);
  display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px;
}
.modal-overlay.show { display: flex; }
.modal {
  background: white; border-radius: 16px; padding: 24px;
  width: 100%; max-width: 380px; box-shadow: 0 16px 48px rgba(0,0,0,0.2);
}
.modal h3 { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
.modal-actions { display: flex; gap: 10px; margin-top: 20px; }
.btn-cancel-modal { flex: 1; padding: 11px; background: var(--bg); border: 1.5px solid var(--border); border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: 600; }
.btn-confirm { flex: 1; padding: 11px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: 700; }

/* 빈 상태 */
.empty-state { text-align: center; padding: 40px 20px; color: var(--text-sub); }
.empty-state .icon { font-size: 48px; margin-bottom: 12px; }
.empty-state p { font-size: 15px; }

/* 토스트 */
.toast {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
  background: #323232; color: white; padding: 12px 20px; border-radius: 8px;
  font-size: 14px; z-index: 9999; opacity: 0; transition: opacity 0.3s;
  white-space: nowrap; pointer-events: none;
}
.toast.show { opacity: 1; }

/* 로딩 */
.loading { text-align: center; padding: 30px; color: var(--text-sub); }

@media (max-width: 400px) {
  .form-row { grid-template-columns: 1fr; }
  .type-select { grid-template-columns: repeat(3, 1fr); }
}
</style>
</head>
<body>

<!-- 로그인 화면 -->
<div id="loginPage">
  <div class="login-box">
    <h1>📅 팀 스케줄</h1>
    <p>팀 일정을 함께 관리하세요</p>
    <div class="input-group">
      <label>이메일</label>
      <input type="email" id="loginEmail" placeholder="이메일 입력" autocomplete="email">
    </div>
    <div class="input-group">
      <label>비밀번호</label>
      <input type="password" id="loginPassword" placeholder="비밀번호 입력" autocomplete="current-password">
    </div>
    <button class="btn-primary" onclick="doLogin()">로그인</button>
    <div class="error-msg" id="loginError"></div>
  </div>
</div>

<!-- 메인 앱 -->
<div id="app">
  <div class="topbar">
    <h1>📅 팀 스케줄</h1>
    <div class="topbar-right">
      <span class="user-badge" id="userBadge"></span>
      <span class="role-badge" id="roleBadge"></span>
      <button class="btn-icon" onclick="doLogout()" title="로그아웃">⏏</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="showTab('calendar')">📅 달력</button>
    <button class="tab" onclick="showTab('request')" id="tabRequest">📝 신청</button>
    <button class="tab" onclick="showTab('admin')" id="tabAdmin" style="display:none">✅ 승인</button>
    <button class="tab" onclick="showTab('members')" id="tabMembers" style="display:none">👥 구성원</button>
  </div>

  <!-- 달력 탭 -->
  <div id="tab-calendar" class="content">
    <div class="calendar-header">
      <button class="btn-nav" onclick="changeMonth(-1)">◀</button>
      <h2 id="calTitle"></h2>
      <button class="btn-nav" onclick="changeMonth(1)">▶</button>
    </div>

    <!-- 범례 -->
    <div class="legend">
      <div class="legend-item"><div class="legend-dot type-연차"></div>연차</div>
      <div class="legend-item"><div class="legend-dot type-휴가"></div>휴가</div>
      <div class="legend-item"><div class="legend-dot type-병가"></div>병가</div>
      <div class="legend-item"><div class="legend-dot type-출장"></div>출장</div>
      <div class="legend-item"><div class="legend-dot type-회의"></div>회의</div>
      <div class="legend-item"><div class="legend-dot type-교육"></div>교육</div>
      <div class="legend-item"><div class="legend-dot type-기타"></div>기타</div>
    </div>

    <div class="cal-grid">
      <div class="cal-weekdays">
        <div class="cal-weekday">일</div>
        <div class="cal-weekday">월</div>
        <div class="cal-weekday">화</div>
        <div class="cal-weekday">수</div>
        <div class="cal-weekday">목</div>
        <div class="cal-weekday">금</div>
        <div class="cal-weekday">토</div>
      </div>
      <div class="cal-days" id="calDays"></div>
    </div>

    <!-- 날짜 상세 -->
    <div class="day-detail" id="dayDetail">
      <h3 id="detailTitle"></h3>
      <div class="attendance-info" id="attendanceInfo"></div>
      <div class="schedule-list" id="scheduleList"></div>
    </div>
  </div>

  <!-- 신청 탭 -->
  <div id="tab-request" class="content" style="display:none">
    <div class="card">
      <h3>📝 일정 신청</h3>
      <div class="form-group">
        <label>일정 종류</label>
        <div class="type-select">
          <button class="type-btn selected" onclick="selectType('연차')" id="type-연차">연차</button>
          <button class="type-btn" onclick="selectType('휴가')" id="type-휴가">휴가</button>
          <button class="type-btn" onclick="selectType('병가')" id="type-병가">병가</button>
          <button class="type-btn" onclick="selectType('출장')" id="type-출장">출장</button>
          <button class="type-btn" onclick="selectType('회의')" id="type-회의">회의</button>
          <button class="type-btn" onclick="selectType('교육')" id="type-교육">교육</button>
          <button class="type-btn" onclick="selectType('기타')" id="type-기타" style="grid-column: span 3;">기타</button>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>시작일</label>
          <input type="date" id="startDate">
        </div>
        <div class="form-group">
          <label>종료일</label>
          <input type="date" id="endDate">
        </div>
      </div>
      <div class="form-group">
        <label>메모 (선택)</label>
        <textarea id="requestNote" rows="3" placeholder="사유나 내용을 입력하세요"></textarea>
      </div>
      <button class="btn-submit" onclick="submitRequest()">신청하기</button>
    </div>

    <!-- 내 신청 목록 -->
    <div class="card">
      <h3>📋 내 신청 내역</h3>
      <div id="myRequests"><div class="loading">불러오는 중...</div></div>
    </div>
  </div>

  <!-- 관리자(승인) 탭 -->
  <div id="tab-admin" class="content" style="display:none">
    <div class="card">
      <h3>⏳ 승인 대기 중</h3>
      <div id="pendingList"><div class="loading">불러오는 중...</div></div>
    </div>
    <div class="card">
      <h3>📋 전체 신청 내역</h3>
      <div id="allRequests"><div class="loading">불러오는 중...</div></div>
    </div>
  </div>

  <!-- 구성원 탭 -->
  <div id="tab-members" class="content" style="display:none">
    <!-- 마스터: 계정 생성 -->
    <div class="card" id="createUserCard" style="display:none">
      <h3>👤 새 계정 만들기</h3>
      <div class="form-group">
        <label>이름</label>
        <input type="text" id="newName" placeholder="이름 입력">
      </div>
      <div class="form-group">
        <label>이메일</label>
        <input type="email" id="newEmail" placeholder="이메일 입력">
      </div>
      <div class="form-group">
        <label>비밀번호</label>
        <input type="password" id="newPassword" placeholder="초기 비밀번호">
      </div>
      <div class="form-group">
        <label>권한</label>
        <select id="newRole">
          <option value="member">팀원</option>
          <option value="manager">팀장</option>
          <option value="master">마스터</option>
        </select>
      </div>
      <button class="btn-submit" onclick="createUser()">계정 생성</button>
    </div>

    <div class="card">
      <h3>👥 구성원 목록</h3>
      <div id="memberList"><div class="loading">불러오는 중...</div></div>
    </div>
  </div>
</div>

<!-- 모달: 권한 변경 -->
<div class="modal-overlay" id="roleModal">
  <div class="modal">
    <h3>권한 변경</h3>
    <div class="form-group">
      <label id="roleModalName">이름</label>
      <select id="roleSelect">
        <option value="member">팀원</option>
        <option value="manager">팀장</option>
        <option value="master">마스터</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel-modal" onclick="closeModal('roleModal')">취소</button>
      <button class="btn-confirm" onclick="confirmRoleChange()">변경</button>
    </div>
  </div>
</div>

<!-- 모달: 신청 취소 확인 -->
<div class="modal-overlay" id="cancelModal">
  <div class="modal">
    <h3>신청 취소</h3>
    <p style="color:#5f6368;font-size:14px">이 일정 신청을 취소하시겠습니까?</p>
    <div class="modal-actions">
      <button class="btn-cancel-modal" onclick="closeModal('cancelModal')">아니요</button>
      <button class="btn-confirm" style="background:#d93025" onclick="confirmCancel()">취소하기</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, createUserWithEmailAndPassword }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc,
  collection, query, where, orderBy, onSnapshot, getDocs, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// ★★★ Firebase 설정 ★★★
const firebaseConfig = {
  apiKey: "AIzaSyBGJnFaCRySZ28KWu8S59-iIAwrLnm0R1I",
  authDomain: "yeong-e9ba0.firebaseapp.com",
  projectId: "yeong-e9ba0",
  storageBucket: "yeong-e9ba0.firebasestorage.app",
  messagingSenderId: "634464450774",
  appId: "1:634464450774:web:cb9499b992d94cc661f177",
  measurementId: "G-P003E7E282"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// ===== 전역 상태 =====
let currentUser = null;
let currentUserData = null;
let currentMonth = new Date();
let allSchedules = [];
let allUsers = {};
let selectedType = '연차';
let selectedDate = null;
let cancelTargetId = null;
let roleTargetId = null;
let unsubSchedules = null;
let unsubUsers = null;

const TOTAL_MEMBERS_KEY = 'totalMembers';

// ===== 로그인 =====
window.doLogin = async function() {
  const email = document.getElementById('loginEmail').value.trim();
  const pw = document.getElementById('loginPassword').value;
  document.getElementById('loginError').textContent = '';
  if (!email || !pw) { document.getElementById('loginError').textContent = '이메일과 비밀번호를 입력하세요.'; return; }
  try {
    await signInWithEmailAndPassword(auth, email, pw);
  } catch(e) {
    document.getElementById('loginError').textContent = '이메일 또는 비밀번호가 올바르지 않습니다.';
  }
};

window.doLogout = async function() {
  if (unsubSchedules) unsubSchedules();
  if (unsubUsers) unsubUsers();
  await signOut(auth);
};

// 엔터키로 로그인
document.getElementById('loginPassword').addEventListener('keyup', e => {
  if (e.key === 'Enter') doLogin();
});

// ===== 인증 상태 감지 =====
onAuthStateChanged(auth, async (user) => {
  if (user) {
    currentUser = user;
    // 유저 정보 로드
    const uDoc = await getDoc(doc(db, 'users', user.uid));
    if (uDoc.exists()) {
      currentUserData = uDoc.data();
    } else {
      // 최초 로그인 (마스터 계정 자동 생성)
      currentUserData = { name: user.email.split('@')[0], role: 'master', email: user.email };
      await setDoc(doc(db, 'users', user.uid), { ...currentUserData, createdAt: serverTimestamp() });
    }
    initApp();
  } else {
    currentUser = null;
    currentUserData = null;
    document.getElementById('loginPage').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
  }
});

function initApp() {
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('app').style.flexDirection = 'column';

  // 상단 배지
  document.getElementById('userBadge').textContent = currentUserData.name;
  const roleLabels = { master: '마스터', manager: '팀장', member: '팀원' };
  document.getElementById('roleBadge').textContent = roleLabels[currentUserData.role] || '팀원';

  // 권한별 탭 표시
  const role = currentUserData.role;
  if (role === 'master' || role === 'manager') {
    document.getElementById('tabAdmin').style.display = '';
    document.getElementById('tabMembers').style.display = '';
  }
  if (role === 'master') {
    document.getElementById('createUserCard').style.display = '';
  }

  // 오늘 날짜 설정
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('startDate').value = today;
  document.getElementById('endDate').value = today;

  // 실시간 데이터 구독
  subscribeSchedules();
  subscribeUsers();
}

// ===== Firestore 실시간 구독 =====
function subscribeSchedules() {
  const q = query(collection(db, 'schedules'), orderBy('startDate', 'asc'));
  unsubSchedules = onSnapshot(q, snap => {
    allSchedules = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderCalendar();
    renderMyRequests();
    if (currentUserData.role !== 'member') {
      renderPendingList();
      renderAllRequests();
    }
    if (selectedDate) showDayDetail(selectedDate);
  });
}

function subscribeUsers() {
  const q = query(collection(db, 'users'), orderBy('name'));
  unsubUsers = onSnapshot(q, snap => {
    allUsers = {};
    snap.docs.forEach(d => { allUsers[d.id] = { id: d.id, ...d.data() }; });
    renderMemberList();
  });
}

// ===== 달력 =====
window.changeMonth = function(delta) {
  currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + delta, 1);
  renderCalendar();
  selectedDate = null;
  document.getElementById('dayDetail').classList.remove('show');
};

function renderCalendar() {
  const year = currentMonth.getFullYear();
  const month = currentMonth.getMonth();
  document.getElementById('calTitle').textContent = `${year}년 ${month + 1}월`;

  const firstDay = new Date(year, month, 1).getDay();
  const lastDate = new Date(year, month + 1, 0).getDate();
  const today = new Date().toISOString().split('T')[0];

  // 해당 월의 승인된 일정만 날짜별로 정리
  const dayMap = {};
  const absentMap = {}; // 날짜별 부재 인원 수

  allSchedules.filter(s => s.status === 'approved').forEach(s => {
    let d = new Date(s.startDate);
    const end = new Date(s.endDate);
    // 연차/휴가/병가는 실근무 인원에서 제외
    const isAbsent = ['연차','휴가','병가'].includes(s.type);
    while (d <= end) {
      const key = d.toISOString().split('T')[0];
      if (!dayMap[key]) dayMap[key] = [];
      dayMap[key].push(s);
      if (isAbsent) absentMap[key] = (absentMap[key] || 0) + 1;
      d.setDate(d.getDate() + 1);
    }
  });

  const totalMembers = Object.keys(allUsers).length;

  let html = '';
  // 이전달 날짜 채우기
  for (let i = 0; i < firstDay; i++) {
    const prevDate = new Date(year, month, -firstDay + i + 1);
    html += `<div class="cal-day other-month"><div class="day-num">${prevDate.getDate()}</div></div>`;
  }

  for (let d = 1; d <= lastDate; d++) {
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const events = dayMap[dateStr] || [];
    const absent = absentMap[dateStr] || 0;
    const present = totalMembers - absent;
    const isToday = dateStr === today;
    const isSelected = dateStr === selectedDate;

    let cls = 'cal-day';
    if (isToday) cls += ' today';
    if (isSelected) cls += ' selected';

    // 점 표시 (최대 5개)
    const dots = events.slice(0, 5).map(e =>
      `<div class="day-dot dot-${e.type}"></div>`
    ).join('');

    // 실근무 인원
    let attendHtml = '';
    if (totalMembers > 0 && events.length > 0) {
      const cls2 = present < Math.ceil(totalMembers * 0.5) ? 'attendance-low' : 'attendance-ok';
      attendHtml = `<span class="attendance-count ${cls2}">${present}명</span>`;
    }

    html += `<div class="${cls}" onclick="showDayDetail('${dateStr}')">
      <div class="day-num">${d}</div>
      <div class="day-events">${dots}</div>
      ${attendHtml}
    </div>`;
  }

  // 다음달 채우기
  const remaining = (7 - (firstDay + lastDate) % 7) % 7;
  for (let d = 1; d <= remaining; d++) {
    html += `<div class="cal-day other-month"><div class="day-num">${d}</div></div>`;
  }

  document.getElementById('calDays').innerHTML = html;
}

window.showDayDetail = function(dateStr) {
  selectedDate = dateStr;
  renderCalendar(); // 선택 표시 업데이트

  const detail = document.getElementById('dayDetail');
  detail.classList.add('show');

  const [y, m, d] = dateStr.split('-');
  document.getElementById('detailTitle').textContent = `${y}년 ${parseInt(m)}월 ${parseInt(d)}일`;

  // 해당 날짜 일정
  const daySchedules = allSchedules.filter(s => {
    if (s.status === 'rejected') return false;
    return s.startDate <= dateStr && s.endDate >= dateStr;
  });

  // 실근무 인원 계산 (승인된 연차/휴가/병가 인원 제외)
  const totalMembers = Object.keys(allUsers).length;
  const absent = daySchedules.filter(s => s.status === 'approved' && ['연차','휴가','병가'].includes(s.type)).length;
  const present = totalMembers - absent;

  document.getElementById('attendanceInfo').textContent =
    totalMembers > 0 ? `실근무 인원: ${present}명 / 전체 ${totalMembers}명` : '';

  if (daySchedules.length === 0) {
    document.getElementById('scheduleList').innerHTML =
      '<div style="color:#9e9e9e;font-size:14px;padding:10px 0">이날 일정이 없습니다.</div>';
    return;
  }

  const role = currentUserData.role;
  let html = daySchedules.map(s => {
    const user = allUsers[s.userId] || { name: '?' };
    const statusMap = { pending: '대기중', approved: '승인', rejected: '반려' };
    const statusCls = { pending: 'status-pending', approved: 'status-approved', rejected: 'status-rejected' };
    let actions = '';
    if ((role === 'master' || role === 'manager') && s.status === 'pending') {
      actions = `<button class="btn-approve" onclick="approveSchedule('${s.id}')">승인</button>
                 <button class="btn-reject" onclick="rejectSchedule('${s.id}')">반려</button>`;
    }
    if ((role === 'master' || role === 'manager') || s.userId === currentUser.uid) {
      actions += ` <button class="btn-delete" onclick="deleteSchedule('${s.id}')">삭제</button>`;
    }
    return `<div class="schedule-item">
      <span class="schedule-type-badge type-${s.type}">${s.type}</span>
      <div class="schedule-info">
        <div class="schedule-name">${user.name}</div>
        ${s.note ? `<div class="schedule-note">${s.note}</div>` : ''}
      </div>
      <div style="display:flex;gap:4px;align-items:center;flex-wrap:wrap">
        <span class="schedule-status ${statusCls[s.status]}">${statusMap[s.status]}</span>
        ${actions}
      </div>
    </div>`;
  }).join('');
  document.getElementById('scheduleList').innerHTML = html;

  detail.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
};

// ===== 일정 신청 =====
window.selectType = function(type) {
  selectedType = type;
  document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('selected'));
  document.getElementById('type-' + type).classList.add('selected');
};

window.submitRequest = async function() {
  const start = document.getElementById('startDate').value;
  const end = document.getElementById('endDate').value;
  const note = document.getElementById('requestNote').value.trim();
  if (!start || !end) { showToast('날짜를 선택하세요.'); return; }
  if (start > end) { showToast('종료일이 시작일보다 빠릅니다.'); return; }
  try {
    await addDoc(collection(db, 'schedules'), {
      userId: currentUser.uid,
      userName: currentUserData.name,
      type: selectedType,
      startDate: start,
      endDate: end,
      note: note,
      status: 'pending',
      createdAt: serverTimestamp(),
    });
    showToast('신청이 완료되었습니다!');
    document.getElementById('requestNote').value = '';
  } catch(e) {
    showToast('신청 중 오류가 발생했습니다.');
    console.error(e);
  }
};

// ===== 내 신청 목록 =====
function renderMyRequests() {
  const mine = allSchedules.filter(s => s.userId === currentUser.uid)
    .sort((a,b) => b.startDate.localeCompare(a.startDate));

  if (mine.length === 0) {
    document.getElementById('myRequests').innerHTML =
      '<div class="empty-state"><div class="icon">📋</div><p>신청 내역이 없습니다.</p></div>';
    return;
  }

  const statusMap = { pending: '⏳ 대기중', approved: '✅ 승인', rejected: '❌ 반려' };
  const statusCls = { pending: 'status-pending', approved: 'status-approved', rejected: 'status-rejected' };
  let html = mine.map(s => `
    <div class="my-request">
      <span class="schedule-type-badge type-${s.type}">${s.type}</span>
      <div style="flex:1">
        <div class="request-dates">${s.startDate} ~ ${s.endDate}</div>
        ${s.note ? `<div class="request-sub">${s.note}</div>` : ''}
      </div>
      <span class="schedule-status ${statusCls[s.status]}">${statusMap[s.status]}</span>
      ${s.status === 'pending' ? `<button class="btn-cancel" onclick="openCancelModal('${s.id}')">취소</button>` : ''}
    </div>
  `).join('');
  document.getElementById('myRequests').innerHTML = html;
}

// ===== 승인 탭 =====
function renderPendingList() {
  const pending = allSchedules.filter(s => s.status === 'pending')
    .sort((a,b) => a.startDate.localeCompare(b.startDate));

  if (pending.length === 0) {
    document.getElementById('pendingList').innerHTML =
      '<div class="empty-state"><div class="icon">✅</div><p>대기 중인 신청이 없습니다.</p></div>';
    return;
  }

  let html = pending.map(s => {
    const user = allUsers[s.userId] || { name: s.userName || '?' };
    return `<div class="pending-item">
      <div class="pending-header">
        <span class="schedule-type-badge type-${s.type}">${s.type}</span>
        <span class="pending-name">${user.name}</span>
      </div>
      <div class="pending-detail">
        📅 ${s.startDate} ~ ${s.endDate}
        ${s.note ? `<br>💬 ${s.note}` : ''}
      </div>
      <div class="pending-actions">
        <button class="btn-lg-approve" onclick="approveSchedule('${s.id}')">✅ 승인</button>
        <button class="btn-lg-reject" onclick="rejectSchedule('${s.id}')">❌ 반려</button>
      </div>
    </div>`;
  }).join('');
  document.getElementById('pendingList').innerHTML = html;
}

function renderAllRequests() {
  const all = [...allSchedules].sort((a,b) => b.startDate.localeCompare(a.startDate));
  if (all.length === 0) {
    document.getElementById('allRequests').innerHTML =
      '<div class="empty-state"><div class="icon">📋</div><p>신청 내역이 없습니다.</p></div>';
    return;
  }
  const statusMap = { pending: '⏳', approved: '✅', rejected: '❌' };
  let html = all.map(s => {
    const user = allUsers[s.userId] || { name: s.userName || '?' };
    return `<div class="my-request">
      <span class="schedule-type-badge type-${s.type}">${s.type}</span>
      <div style="flex:1">
        <div class="request-dates">${user.name} · ${s.startDate} ~ ${s.endDate}</div>
        ${s.note ? `<div class="request-sub">${s.note}</div>` : ''}
      </div>
      <div style="display:flex;gap:4px;align-items:center">
        <span>${statusMap[s.status]}</span>
        <button class="btn-delete" onclick="deleteSchedule('${s.id}')">삭제</button>
      </div>
    </div>`;
  }).join('');
  document.getElementById('allRequests').innerHTML = html;
}

// ===== 승인/반려/삭제 =====
window.approveSchedule = async function(id) {
  try {
    await updateDoc(doc(db, 'schedules', id), { status: 'approved' });
    showToast('승인되었습니다.');
  } catch(e) { showToast('오류가 발생했습니다.'); }
};

window.rejectSchedule = async function(id) {
  try {
    await updateDoc(doc(db, 'schedules', id), { status: 'rejected' });
    showToast('반려되었습니다.');
  } catch(e) { showToast('오류가 발생했습니다.'); }
};

window.deleteSchedule = async function(id) {
  try {
    await deleteDoc(doc(db, 'schedules', id));
    showToast('삭제되었습니다.');
    if (selectedDate) showDayDetail(selectedDate);
  } catch(e) { showToast('오류가 발생했습니다.'); }
};

// ===== 취소 모달 =====
window.openCancelModal = function(id) {
  cancelTargetId = id;
  document.getElementById('cancelModal').classList.add('show');
};
window.confirmCancel = async function() {
  closeModal('cancelModal');
  if (cancelTargetId) await deleteSchedule(cancelTargetId);
  cancelTargetId = null;
};

// ===== 구성원 목록 =====
function renderMemberList() {
  const members = Object.values(allUsers).sort((a,b) => a.name.localeCompare(b.name));
  if (members.length === 0) {
    document.getElementById('memberList').innerHTML =
      '<div class="empty-state"><p>구성원이 없습니다.</p></div>';
    return;
  }
  const roleLabel = { master: '마스터', manager: '팀장', member: '팀원' };
  const roleCls = { master: 'role-master', manager: 'role-manager', member: 'role-member' };
  const canManage = currentUserData.role === 'master';

  let html = members.map(u => `
    <div class="member-item">
      <div class="member-info">
        <div class="member-avatar">${u.name[0]}</div>
        <div>
          <div class="member-name">${u.name}</div>
          <div class="member-email">${u.email || ''}</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="member-role ${roleCls[u.role]}">${roleLabel[u.role] || '팀원'}</span>
        ${canManage && u.id !== currentUser.uid ?
          `<button class="btn-small" onclick="openRoleModal('${u.id}','${u.role}','${u.name}')">권한변경</button>` : ''}
      </div>
    </div>
  `).join('');
  document.getElementById('memberList').innerHTML = html;
}

// ===== 권한 변경 =====
window.openRoleModal = function(uid, role, name) {
  roleTargetId = uid;
  document.getElementById('roleModalName').textContent = `${name}의 권한`;
  document.getElementById('roleSelect').value = role;
  document.getElementById('roleModal').classList.add('show');
};
window.confirmRoleChange = async function() {
  const newRole = document.getElementById('roleSelect').value;
  closeModal('roleModal');
  try {
    await updateDoc(doc(db, 'users', roleTargetId), { role: newRole });
    showToast('권한이 변경되었습니다.');
  } catch(e) { showToast('오류가 발생했습니다.'); }
  roleTargetId = null;
};

// ===== 계정 생성 (마스터) =====
window.createUser = async function() {
  const name = document.getElementById('newName').value.trim();
  const email = document.getElementById('newEmail').value.trim();
  const pw = document.getElementById('newPassword').value;
  const role = document.getElementById('newRole').value;
  if (!name || !email || !pw) { showToast('모든 항목을 입력하세요.'); return; }
  try {
    // 보조 앱으로 계정 생성 (현재 로그인 세션 유지)
    const secondApp = initializeApp(firebaseConfig, 'secondary');
    const secondAuth = getAuth(secondApp);
    const cred = await createUserWithEmailAndPassword(secondAuth, email, pw);
    await setDoc(doc(db, 'users', cred.user.uid), {
      name, email, role, createdAt: serverTimestamp()
    });
    await secondAuth.signOut();
    showToast(`${name} 계정이 생성되었습니다.`);
    document.getElementById('newName').value = '';
    document.getElementById('newEmail').value = '';
    document.getElementById('newPassword').value = '';
  } catch(e) {
    if (e.code === 'auth/email-already-in-use') showToast('이미 사용 중인 이메일입니다.');
    else showToast('계정 생성에 실패했습니다: ' + e.message);
    console.error(e);
  }
};

// ===== 탭 전환 =====
window.showTab = function(tab) {
  ['calendar','request','admin','members'].forEach(t => {
    document.getElementById('tab-' + t).style.display = t === tab ? '' : 'none';
  });
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  event.currentTarget.classList.add('active');

  if (tab === 'request') renderMyRequests();
  if (tab === 'admin') { renderPendingList(); renderAllRequests(); }
  if (tab === 'members') renderMemberList();
};

// ===== 유틸 =====
window.closeModal = function(id) {
  document.getElementById(id).classList.remove('show');
};

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// 모달 외부 클릭 닫기
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) m.classList.remove('show'); });
});

// 엔터키 로그인
document.getElementById('loginEmail').addEventListener('keyup', e => {
  if (e.key === 'Enter') document.getElementById('loginPassword').focus();
});
</script>
