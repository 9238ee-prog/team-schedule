<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="팀 스케줄">
<meta name="theme-color" content="#1a73e8">
<title>팀 스케줄</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --primary: #1a73e8; --primary-dark: #1557b0;
  --bg: #f8f9fa; --card: #ffffff; --text: #202124; --text-sub: #5f6368;
  --border: #e0e0e0; --danger: #d93025; --success: #188038;
  --holiday: #d93025; --shadow: 0 2px 8px rgba(0,0,0,0.12);
}
body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "맑은 고딕", sans-serif; background: var(--bg); color: var(--text); }

.type-연차{background:#ea4335}.type-휴가{background:#34a853}.type-병가{background:#9c27b0}
.type-출장{background:#ff9800}.type-회의{background:#1a73e8}.type-교육{background:#00bcd4}.type-기타{background:#607d8b}
.dot-연차{background:#ea4335}.dot-휴가{background:#34a853}.dot-병가{background:#9c27b0}
.dot-출장{background:#ff9800}.dot-회의{background:#1a73e8}.dot-교육{background:#00bcd4}.dot-기타{background:#607d8b}

/* 로그인/가입 */
#loginPage { min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#1a73e8 0%,#0d47a1 100%); }
.auth-box { background:white; border-radius:16px; padding:36px 28px; width:90%; max-width:380px; box-shadow:0 8px 32px rgba(0,0,0,0.2); }
.auth-box h1 { font-size:24px; margin-bottom:6px; color:var(--primary); }
.auth-box p { color:var(--text-sub); margin-bottom:24px; font-size:14px; }
.auth-tabs { display:flex; margin-bottom:24px; border-bottom:2px solid var(--border); }
.auth-tab { flex:1; padding:10px; text-align:center; font-size:14px; font-weight:600; color:var(--text-sub); cursor:pointer; border-bottom:3px solid transparent; transition:all 0.2s; background:none; border-top:none; border-left:none; border-right:none; }
.auth-tab.active { color:var(--primary); border-bottom-color:var(--primary); }
.auth-panel { display:none; }
.auth-panel.active { display:block; }
.input-group { margin-bottom:14px; }
.input-group label { display:block; font-size:13px; color:var(--text-sub); margin-bottom:6px; font-weight:600; }
.input-group input { width:100%; padding:12px 14px; border:1.5px solid var(--border); border-radius:8px; font-size:15px; outline:none; transition:border 0.2s; font-family:inherit; }
.input-group input:focus { border-color:var(--primary); }
.input-hint { font-size:12px; color:var(--text-sub); margin-top:5px; }
.btn-primary { width:100%; padding:13px; background:var(--primary); color:white; border:none; border-radius:8px; font-size:16px; font-weight:600; cursor:pointer; transition:background 0.2s; font-family:inherit; }
.btn-primary:hover { background:var(--primary-dark); }
.error-msg { color:var(--danger); font-size:13px; margin-top:10px; text-align:center; min-height:18px; }
.success-msg { color:var(--success); font-size:13px; margin-top:10px; text-align:center; }

/* 앱 */
#app { display:none; flex-direction:column; min-height:100vh; }
.topbar { background:var(--primary); color:white; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; box-shadow:var(--shadow); }
.topbar h1 { font-size:18px; font-weight:700; }
.topbar-right { display:flex; align-items:center; gap:8px; }
.user-badge { background:rgba(255,255,255,0.2); border-radius:20px; padding:4px 12px; font-size:13px; }
.role-badge { border-radius:12px; padding:2px 8px; font-size:11px; font-weight:600; }
.role-badge.master { background:#d93025; }
.role-badge.manager { background:#ff9800; }
.role-badge.member { background:rgba(255,255,255,0.3); }
.btn-icon { background:none; border:none; color:white; cursor:pointer; font-size:20px; padding:4px; }

.tabs { display:flex; background:white; border-bottom:2px solid var(--border); position:sticky; top:52px; z-index:99; overflow-x:auto; }
.tab { flex:1; min-width:60px; padding:12px 4px; text-align:center; font-size:13px; font-weight:600; color:var(--text-sub); cursor:pointer; border-bottom:3px solid transparent; transition:all 0.2s; border:none; background:none; white-space:nowrap; }
.tab.active { color:var(--primary); border-bottom-color:var(--primary); }
.tab .badge { background:var(--danger); color:white; border-radius:10px; padding:1px 6px; font-size:11px; margin-left:4px; }

.content { padding:16px; max-width:800px; margin:0 auto; width:100%; }

/* 달력 */
.calendar-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.calendar-header h2 { font-size:18px; font-weight:700; }
.btn-nav { background:white; border:1.5px solid var(--border); border-radius:8px; padding:6px 14px; cursor:pointer; font-size:16px; }
.cal-grid { background:white; border-radius:12px; overflow:hidden; box-shadow:var(--shadow); margin-bottom:16px; }
.cal-weekdays { display:grid; grid-template-columns:repeat(7,1fr); background:var(--bg); padding:8px 0; }
.cal-weekday { text-align:center; font-size:12px; font-weight:600; color:var(--text-sub); padding:4px 0; }
.cal-weekday:first-child { color:#d93025; }
.cal-weekday:last-child { color:#1a73e8; }
.cal-days { display:grid; grid-template-columns:repeat(7,1fr); }
.cal-day { min-height:70px; padding:4px; border-top:1px solid var(--border); border-right:1px solid var(--border); cursor:pointer; transition:background 0.15s; position:relative; }
.cal-day:hover { background:#f0f4ff; }
.cal-day.other-month .day-num { color:#ccc; }
.cal-day.today { background:#e8f0fe; }
.cal-day.today .day-num { background:var(--primary); color:white; border-radius:50%; width:22px; height:22px; display:flex; align-items:center; justify-content:center; }
.cal-day.holiday-day { background:#fff5f5; }
.cal-day.holiday-day .day-num { color:var(--holiday) !important; }
.cal-day.selected { background:#fff3e0; }
.day-num { font-size:13px; font-weight:500; margin-bottom:2px; width:22px; height:22px; display:flex; align-items:center; justify-content:center; }
.cal-day:nth-child(7n+1) .day-num { color:#d93025; }
.cal-day:nth-child(7n) .day-num { color:#1a73e8; }
.day-holiday-name { font-size:9px; color:var(--holiday); font-weight:600; line-height:1.2; margin-bottom:2px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.day-events { display:flex; flex-wrap:wrap; gap:1px; }
.day-dot { width:6px; height:6px; border-radius:50%; }
.attendance-count { font-size:10px; font-weight:600; position:absolute; bottom:3px; right:4px; }
.attendance-ok { color:var(--success); }
.attendance-low { color:var(--danger); }

/* 범례 */
.legend { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; background:white; padding:12px; border-radius:10px; box-shadow:var(--shadow); }
.legend-item { display:flex; align-items:center; gap:5px; font-size:12px; }
.legend-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
.legend-holiday { background:var(--holiday); }

/* 날짜 상세 */
.day-detail { background:white; border-radius:12px; box-shadow:var(--shadow); padding:16px; margin-bottom:16px; display:none; }
.day-detail.show { display:block; }
.day-detail h3 { font-size:16px; font-weight:700; margin-bottom:4px; }
.holiday-banner { background:#fff0f0; border:1px solid #ffcdd2; border-radius:8px; padding:8px 12px; margin-bottom:10px; font-size:13px; color:var(--holiday); font-weight:600; }
.attendance-info { font-size:13px; color:var(--text-sub); margin-bottom:12px; }
.schedule-list { display:flex; flex-direction:column; gap:8px; }
.schedule-item { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; background:var(--bg); flex-wrap:wrap; }
.schedule-type-badge { color:white; font-size:11px; font-weight:700; padding:3px 8px; border-radius:12px; white-space:nowrap; flex-shrink:0; }
.schedule-info { flex:1; min-width:80px; }
.schedule-name { font-size:14px; font-weight:600; }
.schedule-note { font-size:12px; color:var(--text-sub); }
.schedule-actions { display:flex; gap:4px; flex-wrap:wrap; align-items:center; }
.status-pending { color:#ff9800; font-size:12px; font-weight:600; }
.status-approved { color:var(--success); font-size:12px; font-weight:600; }
.status-rejected { color:var(--danger); font-size:12px; font-weight:600; }
.btn-approve { background:var(--success); color:white; border:none; border-radius:6px; padding:4px 10px; font-size:12px; cursor:pointer; }
.btn-reject { background:var(--danger); color:white; border:none; border-radius:6px; padding:4px 10px; font-size:12px; cursor:pointer; }
.btn-delete { background:#9e9e9e; color:white; border:none; border-radius:6px; padding:4px 10px; font-size:12px; cursor:pointer; }

/* 카드/폼 */
.card { background:white; border-radius:12px; box-shadow:var(--shadow); padding:20px; margin-bottom:16px; }
.card h3 { font-size:16px; font-weight:700; margin-bottom:16px; color:var(--primary); }
.form-group { margin-bottom:14px; }
.form-group label { display:block; font-size:13px; font-weight:600; color:var(--text-sub); margin-bottom:6px; }
.form-group input, .form-group select, .form-group textarea { width:100%; padding:11px 13px; border:1.5px solid var(--border); border-radius:8px; font-size:14px; outline:none; transition:border 0.2s; font-family:inherit; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color:var(--primary); }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.type-select { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px; }
.type-btn { padding:10px 4px; border:2px solid var(--border); border-radius:8px; background:white; font-size:13px; cursor:pointer; text-align:center; font-weight:600; transition:all 0.2s; color:var(--text-sub); font-family:inherit; }
.type-btn.selected { border-color:var(--primary); color:var(--primary); background:#e8f0fe; }
.btn-submit { width:100%; padding:13px; background:var(--primary); color:white; border:none; border-radius:8px; font-size:15px; font-weight:700; cursor:pointer; transition:background 0.2s; font-family:inherit; }
.btn-submit:hover { background:var(--primary-dark); }

/* 내 신청 */
.my-request { display:flex; align-items:center; gap:10px; padding:12px; border-radius:10px; border:1.5px solid var(--border); margin-bottom:8px; background:white; flex-wrap:wrap; }
.request-dates { font-size:13px; font-weight:600; }
.request-sub { font-size:12px; color:var(--text-sub); }
.btn-cancel-req { background:#f5f5f5; color:var(--danger); border:1px solid var(--border); border-radius:6px; padding:5px 10px; font-size:12px; cursor:pointer; font-weight:600; font-family:inherit; }

/* 승인 탭 */
.pending-item { background:white; border-radius:10px; padding:14px; box-shadow:var(--shadow); margin-bottom:10px; }
.pending-header { display:flex; align-items:center; gap:8px; margin-bottom:6px; flex-wrap:wrap; }
.pending-name { font-size:15px; font-weight:700; }
.pending-detail { font-size:13px; color:var(--text-sub); margin-bottom:10px; line-height:1.6; }
.pending-actions { display:flex; gap:8px; }
.btn-lg-approve { flex:1; padding:10px; background:var(--success); color:white; border:none; border-radius:8px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; }
.btn-lg-reject { flex:1; padding:10px; background:var(--danger); color:white; border:none; border-radius:8px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; }

/* 가입 대기 */
.signup-item { background:white; border-radius:10px; padding:14px; box-shadow:var(--shadow); margin-bottom:10px; }
.signup-header { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.signup-detail { font-size:13px; color:var(--text-sub); margin-bottom:10px; }

/* 구성원 */
.member-item { display:flex; align-items:center; justify-content:space-between; padding:12px; background:white; border-radius:10px; box-shadow:var(--shadow); margin-bottom:8px; flex-wrap:wrap; gap:8px; }
.member-info { display:flex; align-items:center; gap:10px; }
.member-avatar { width:40px; height:40px; border-radius:50%; background:var(--primary); color:white; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:16px; flex-shrink:0; }
.member-name { font-size:15px; font-weight:600; }
.member-id { font-size:12px; color:var(--text-sub); }
.member-actions { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.role-label.master { color:#d93025; font-size:12px; font-weight:700; }
.role-label.manager { color:#ff9800; font-size:12px; font-weight:700; }
.role-label.member { color:var(--primary); font-size:12px; font-weight:700; }
.btn-small { padding:5px 12px; border-radius:6px; font-size:12px; cursor:pointer; border:1.5px solid var(--border); background:white; font-weight:600; font-family:inherit; }
.group-toggle { display:flex; border-radius:8px; overflow:hidden; border:1.5px solid var(--border); }
.group-btn { padding:5px 10px; font-size:12px; cursor:pointer; border:none; background:white; font-weight:600; font-family:inherit; transition:all 0.2s; }
.group-btn.active-counselor { background:#1a73e8; color:white; }
.group-btn.active-other { background:#9e9e9e; color:white; }

/* 공휴일 관리 (마스터) */
.holiday-item { display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border-radius:8px; background:var(--bg); margin-bottom:8px; }
.holiday-date { font-size:13px; font-weight:700; color:var(--holiday); }
.holiday-name-text { font-size:13px; }
.btn-del-holiday { background:none; border:none; color:#9e9e9e; cursor:pointer; font-size:16px; }

/* 모달 */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); display:none; align-items:center; justify-content:center; z-index:1000; padding:20px; }
.modal-overlay.show { display:flex; }
.modal { background:white; border-radius:16px; padding:24px; width:100%; max-width:380px; box-shadow:0 16px 48px rgba(0,0,0,0.2); }
.modal h3 { font-size:18px; font-weight:700; margin-bottom:16px; }
.modal-actions { display:flex; gap:10px; margin-top:20px; }
.btn-cancel-modal { flex:1; padding:11px; background:var(--bg); border:1.5px solid var(--border); border-radius:8px; font-size:14px; cursor:pointer; font-weight:600; font-family:inherit; }
.btn-confirm { flex:1; padding:11px; background:var(--primary); color:white; border:none; border-radius:8px; font-size:14px; cursor:pointer; font-weight:700; font-family:inherit; }

/* 빈 상태 */
.empty-state { text-align:center; padding:30px 20px; color:var(--text-sub); }
.empty-state .icon { font-size:40px; margin-bottom:10px; }
.loading { text-align:center; padding:20px; color:var(--text-sub); font-size:14px; }

/* 토스트 */
.toast { position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:#323232; color:white; padding:12px 20px; border-radius:8px; font-size:14px; z-index:9999; opacity:0; transition:opacity 0.3s; white-space:nowrap; pointer-events:none; }
.toast.show { opacity:1; }

/* 구분선 */
.section-title { font-size:14px; font-weight:700; color:var(--text-sub); margin:16px 0 8px; }

@media(max-width:400px) { .form-row { grid-template-columns:1fr; } }
</style>
</head>
<body>

<!-- 로그인/가입 -->
<div id="loginPage">
  <div class="auth-box">
    <h1>📅 팀 스케줄</h1>
    <p>팀 일정을 함께 관리하세요</p>
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchAuthTab('login')">로그인</button>
      <button class="auth-tab" onclick="switchAuthTab('signup')">가입 신청</button>
    </div>

    <!-- 로그인 패널 -->
    <div class="auth-panel active" id="panel-login">
      <div class="input-group">
        <label>아이디</label>
        <input type="text" id="loginId" placeholder="아이디 입력" autocomplete="username">
      </div>
      <div class="input-group">
        <label>비밀번호</label>
        <input type="password" id="loginPw" placeholder="비밀번호 입력" autocomplete="current-password">
      </div>
      <button class="btn-primary" onclick="doLogin()">로그인</button>
      <div class="error-msg" id="loginError"></div>
    </div>

    <!-- 가입신청 패널 -->
    <div class="auth-panel" id="panel-signup">
      <div class="input-group">
        <label>아이디</label>
        <input type="text" id="signupId" placeholder="영문+숫자 조합" autocomplete="off">
        <div class="input-hint">※ 영문 소문자, 숫자 사용 (4~20자)</div>
      </div>
      <div class="input-group">
        <label>비밀번호</label>
        <input type="password" id="signupPw" placeholder="6자 이상" autocomplete="new-password">
      </div>
      <div class="input-group">
        <label>닉네임</label>
        <input type="text" id="signupNick" placeholder="표시될 이름" autocomplete="off">
      </div>
      <button class="btn-primary" onclick="doSignup()">가입 신청하기</button>
      <div class="error-msg" id="signupError"></div>
      <div class="success-msg" id="signupSuccess"></div>
    </div>
  </div>
</div>

<!-- 메인 앱 -->
<div id="app">
  <div class="topbar">
    <h1>📅 팀 스케줄</h1>
    <div class="topbar-right">
      <span class="user-badge" id="userBadge"></span>
      <span class="role-badge" id="roleBadge"></span>
      <button class="btn-icon" onclick="doLogout()">⏏</button>
    </div>
  </div>

  <div class="tabs" id="mainTabs">
    <button class="tab active" onclick="showTab('calendar',this)">📅 달력</button>
    <button class="tab" onclick="showTab('request',this)">📝 신청</button>
    <button class="tab" onclick="showTab('admin',this)" id="tabAdmin" style="display:none">✅ 승인<span class="badge" id="pendingBadge" style="display:none">0</span></button>
    <button class="tab" onclick="showTab('members',this)" id="tabMembers" style="display:none">👥 구성원</button>
    <button class="tab" onclick="showTab('settings',this)" id="tabSettings" style="display:none">⚙️ 설정</button>
  </div>

  <!-- 달력 탭 -->
  <div id="tab-calendar" class="content">
    <div class="calendar-header">
      <button class="btn-nav" onclick="changeMonth(-1)">◀</button>
      <h2 id="calTitle"></h2>
      <button class="btn-nav" onclick="changeMonth(1)">▶</button>
    </div>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot legend-holiday"></div>공휴일</div>
      <div class="legend-item"><div class="legend-dot dot-연차"></div>연차</div>
      <div class="legend-item"><div class="legend-dot dot-휴가"></div>휴가</div>
      <div class="legend-item"><div class="legend-dot dot-병가"></div>병가</div>
      <div class="legend-item"><div class="legend-dot dot-출장"></div>출장</div>
      <div class="legend-item"><div class="legend-dot dot-회의"></div>회의</div>
      <div class="legend-item"><div class="legend-dot dot-교육"></div>교육</div>
      <div class="legend-item"><div class="legend-dot dot-기타"></div>기타</div>
    </div>
    <div class="cal-grid">
      <div class="cal-weekdays">
        <div class="cal-weekday">일</div><div class="cal-weekday">월</div>
        <div class="cal-weekday">화</div><div class="cal-weekday">수</div>
        <div class="cal-weekday">목</div><div class="cal-weekday">금</div>
        <div class="cal-weekday">토</div>
      </div>
      <div class="cal-days" id="calDays"></div>
    </div>
    <div class="day-detail" id="dayDetail">
      <h3 id="detailTitle"></h3>
      <div class="holiday-banner" id="holidayBanner" style="display:none"></div>
      <div class="attendance-info" id="attendanceInfo"></div>
      <div class="schedule-list" id="scheduleList"></div>
    </div>
  </div>

  <!-- 신청 탭 -->
  <div id="tab-request" class="content" style="display:none">
    <div class="card">
      <h3>📝 일정 신청</h3>
      <div class="form-group"><label>일정 종류</label>
        <div class="type-select">
          <button class="type-btn selected" onclick="selectType('연차')" id="type-연차">연차</button>
          <button class="type-btn" onclick="selectType('휴가')" id="type-휴가">휴가</button>
          <button class="type-btn" onclick="selectType('병가')" id="type-병가">병가</button>
          <button class="type-btn" onclick="selectType('출장')" id="type-출장">출장</button>
          <button class="type-btn" onclick="selectType('회의')" id="type-회의">회의</button>
          <button class="type-btn" onclick="selectType('교육')" id="type-교육">교육</button>
          <button class="type-btn" onclick="selectType('기타')" id="type-기타" style="grid-column:span 3">기타</button>
        </div>
      </div>

function subscribeAll() {
  // 일정
  const q1 = query(collection(db, 'schedules'), orderBy('startDate'));
  unsubSchedules = onSnapshot(q1, snap => {

  const q2 = query(collection(db, 'users'), orderBy('nickname'));

// ===== 공휴일 API =====
async function fetchHolidays(year, month) {
  const key = `${year}${String(month).padStart(2,'0')}`;
  if (holidayCache[key]) return holidayCache[key];

  try {
    const url = `https://apis.data.go.kr/B090041/openapi/service/SpcdeInfoService/getRestDeInfo?serviceKey=${HOLIDAY_API_KEY}&solYear=${year}&solMonth=${String(month).padStart(2,'0')}&_type=json&numOfRows=50`;
    const res = await fetch(url);
    const json = await res.json();
    const items = json?.response?.body?.items?.item;
    const result = {};
    if (items) {
      const arr = Array.isArray(items) ? items : [items];
      arr.forEach(h => { result[String(h.locdate)] = h.dateName; });
    }
    holidayCache[key] = result;
    return result;
  } catch(e) {
    console.warn('공휴일 API 오류:', e);
    return {};
  }
}

function getCustomHolidayMap() {
  const map = {};
  customHolidays.forEach(h => {
    const key = h.date.replace(/-/g, '');
    map[key] = h.name;
  });
  return map;
}

// ===== 달력 =====
window.changeMonth = function(delta) {
  currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + delta, 1);
  renderCalendar();
  selectedDate = null;
  document.getElementById('dayDetail').classList.remove('show');
};

async function renderCalendar() {
  const year = currentMonth.getFullYear();
  const month = currentMonth.getMonth() + 1;
  document.getElementById('calTitle').textContent = `${year}년 ${month}월`;

  // 공휴일 조회
  const apiHolidays = await fetchHolidays(year, month);
  const customMap = getCustomHolidayMap();
  const allHolidays = { ...apiHolidays, ...customMap };

  const firstDay = new Date(year, month - 1, 1).getDay();
  const lastDate = new Date(year, month, 0).getDate();
  const today = new Date().toISOString().split('T')[0];

  // 승인된 일정 날짜별 정리
  const dayMap = {}, absentMap = {};
  allSchedules.filter(s => s.status === 'approved').forEach(s => {
    let d = new Date(s.startDate);
    const end = new Date(s.endDate);
    const isAbsent = ['연차','휴가','병가'].includes(s.type);
    while (d <= end) {
      const key = d.toISOString().split('T')[0];
      if (!dayMap[key]) dayMap[key] = [];
      dayMap[key].push(s);
      // 상담사 그룹 인원만 카운트
      const user = allUsers[s.userId];
      if (isAbsent && user && user.group === 'counselor') {
        absentMap[key] = (absentMap[key] || 0) + 1;
      }
      d.setDate(d.getDate() + 1);
    }
  });

  const counselorCount = Object.values(allUsers).filter(u => u.group === 'counselor').length;

  let html = '';
  // 이전달
  for (let i = 0; i < firstDay; i++) {
    const d = new Date(year, month - 1, -firstDay + i + 1);
    html += `<div class="cal-day other-month"><div class="day-num">${d.getDate()}</div></div>`;
  }

  for (let d = 1; d <= lastDate; d++) {
    const dateStr = `${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dateKey = dateStr.replace(/-/g,'');
    const events = dayMap[dateStr] || [];
    const absent = absentMap[dateStr] || 0;
    const present = counselorCount - absent;
    const isToday = dateStr === today;
    const isSelected = dateStr === selectedDate;
    const holidayName = allHolidays[dateKey];
    const isHoliday = !!holidayName;

    let cls = 'cal-day';
    if (isToday) cls += ' today';
    if (isSelected) cls += ' selected';
    if (isHoliday) cls += ' holiday-day';

    const dots = events.slice(0,5).map(e => `<div class="day-dot dot-${e.type}"></div>`).join('');

    let attendHtml = '';
    if (counselorCount > 0 && (events.length > 0 || absent > 0)) {
      const cls2 = present < Math.ceil(counselorCount * 0.5) ? 'attendance-low' : 'attendance-ok';
      attendHtml = `<span class="attendance-count ${cls2}">${present}명</span>`;
    }

    const hNameHtml = holidayName ? `<div class="day-holiday-name">${holidayName}</div>` : '';

    html += `<div class="${cls}" onclick="showDayDetail('${dateStr}')">
      <div class="day-num">${d}</div>
      ${hNameHtml}
      <div class="day-events">${dots}</div>
      ${attendHtml}
    </div>`;
  }

  // 다음달
  const remaining = (7 - (firstDay + lastDate) % 7) % 7;
  for (let d = 1; d <= remaining; d++) {
    html += `<div class="cal-day other-month"><div class="day-num">${d}</div></div>`;
  }

  document.getElementById('calDays').innerHTML = html;
}

window.showDayDetail = async function(dateStr) {
  selectedDate = dateStr;
  await renderCalendar();

  const detail = document.getElementById('dayDetail');
  detail.classList.add('show');

  const [y, m, d] = dateStr.split('-');
  document.getElementById('detailTitle').textContent = `${y}년 ${parseInt(m)}월 ${parseInt(d)}일`;

  // 공휴일 확인
  const apiHolidays = await fetchHolidays(parseInt(y), parseInt(m));
  const customMap = getCustomHolidayMap();
  const allHolidays = { ...apiHolidays, ...customMap };
  const dateKey = dateStr.replace(/-/g,'');
  const holidayName = allHolidays[dateKey];
  const banner = document.getElementById('holidayBanner');
  if (holidayName) { banner.textContent = `🔴 ${holidayName}`; banner.style.display = ''; }
  else { banner.style.display = 'none'; }

  // 해당 날짜 일정
  const daySchedules = allSchedules.filter(s => s.status !== 'rejected' && s.startDate <= dateStr && s.endDate >= dateStr);

  // 상담사 실근무
  const counselorCount = Object.values(allUsers).filter(u => u.group === 'counselor').length;
  const absent = daySchedules.filter(s => s.status === 'approved' && ['연차','휴가','병가'].includes(s.type) && allUsers[s.userId]?.group === 'counselor').length;
  const present = counselorCount - absent;
  document.getElementById('attendanceInfo').textContent =
    counselorCount > 0 ? `실근무 인원: ${present}명 / 상담사 ${counselorCount}명` : '';

  if (daySchedules.length === 0) {
    document.getElementById('scheduleList').innerHTML = '<div style="color:#9e9e9e;font-size:14px;padding:10px 0">이날 일정이 없습니다.</div>';
    detail.scrollIntoView({ behavior:'smooth', block:'nearest' });
    return;
  }

  const role = currentUserData.role;
  const statusMap = { pending:'대기중', approved:'승인', rejected:'반려' };
  const statusCls = { pending:'status-pending', approved:'status-approved', rejected:'status-rejected' };

  let html = daySchedules.map(s => {
    const user = allUsers[s.userId] || { nickname: s.userName || '?' };
    const name = user.nickname || user.name || '?';
    let actions = '';
    if ((role==='master'||role==='manager') && s.status==='pending') {
      actions += `<button class="btn-approve" onclick="approveSchedule('${s.id}')">승인</button>
                  <button class="btn-reject" onclick="rejectSchedule('${s.id}')">반려</button>`;
    }
    if (role==='master'||role==='manager'||s.userId===currentUser.uid) {
      actions += ` <button class="btn-delete" onclick="deleteSchedule('${s.id}')">삭제</button>`;
    }
    return `<div class="schedule-item">
      <span class="schedule-type-badge type-${s.type}">${s.type}</span>
      <div class="schedule-info">
        <div class="schedule-name">${name}</div>
        ${s.note ? `<div class="schedule-note">${s.note}</div>` : ''}
      </div>
      <div class="schedule-actions">
        <span class="${statusCls[s.status]}">${statusMap[s.status]}</span>
        ${actions}
      </div>
    </div>`;
  }).join('');
  document.getElementById('scheduleList').innerHTML = html;
  detail.scrollIntoView({ behavior:'smooth', block:'nearest' });
};

      userId: currentUser.uid,
      userName: nick,
      type: selectedType,
      startDate: start, endDate: end, note,
      status: 'pending',
      createdAt: serverTimestamp()

    showToast('신청이 완료되었습니다!');
    document.getElementById('requestNote').value = '';
  } catch(e) { showToast('신청 중 오류가 발생했습니다.'); console.error(e); }
};

function renderMyRequests() {
  const mine = allSchedules.filter(s => s.userId === currentUser.uid)
    .sort((a,b) => b.startDate.localeCompare(a.startDate));
  if (mine.length === 0) {
    document.getElementById('myRequests').innerHTML = '<div class="empty-state"><div class="icon">📋</div><p>신청 내역이 없습니다.</p></div>';
    return;
  }
  const statusMap = { pending:'⏳ 대기중', approved:'✅ 승인', rejected:'❌ 반려' };
  const statusCls = { pending:'status-pending', approved:'status-approved', rejected:'status-rejected' };
  document.getElementById('myRequests').innerHTML = mine.map(s => `
    <div class="my-request">
      <span class="schedule-type-badge type-${s.type}">${s.type}</span>
      <div style="flex:1">
        <div class="request-dates">${s.startDate} ~ ${s.endDate}</div>
        ${s.note ? `<div class="request-sub">${s.note}</div>` : ''}
      </div>
      <span class="${statusCls[s.status]}">${statusMap[s.status]}</span>
      ${s.status==='pending' ? `<button class="btn-cancel-req" onclick="openCancelModal('${s.id}')">취소</button>` : ''}
    </div>`).join('');
}

// ===== 가입 승인 =====
function renderSignupPending() {
  if (signupRequests.length === 0) {
    document.getElementById('signupPendingList').innerHTML = '<div class="empty-state"><div class="icon">✅</div><p>대기 중인 가입 신청이 없습니다.</p></div>';
    return;
  }
  document.getElementById('signupPendingList').innerHTML = signupRequests.map(r => `
    <div class="signup-item">
      <div class="signup-header">
        <span style="font-size:15px;font-weight:700">${r.nickname}</span>
        <span style="font-size:13px;color:#5f6368">(@${r.userId})</span>
      </div>
      <div class="signup-detail">신청일: ${r.createdAt ? new Date(r.createdAt.toDate()).toLocaleDateString('ko-KR') : '-'}</div>
      <div class="pending-actions">
        <button class="btn-lg-approve" onclick="approveSignup('${r.id}','${r.userId}','${r.nickname}','${r.password}')">✅ 승인</button>
        <button class="btn-lg-reject" onclick="rejectSignup('${r.id}')">❌ 거절</button>
      </div>
    </div>`).join('');
}

window.approveSignup = async function(docId, userId, nickname, password) {
  try {
    // Firebase 계정 생성
    const secondApp = initializeApp(firebaseConfig, 'secondary_' + Date.now());
    const secondAuth = getAuth(secondApp);
    const email = idToEmail(userId);
    const cred = await createUserWithEmailAndPassword(secondAuth, email, password);
    // Firestore 유저 문서 생성
    await setDoc(doc(db, 'users', cred.user.uid), {
      userId, nickname, name: nickname, role: 'member', group: 'counselor',
      email, createdAt: serverTimestamp()
    });
    // 신청 문서 삭제
    await deleteDoc(doc(db, 'signupRequests', docId));
    await secondAuth.signOut();
    showToast(`${nickname} 가입이 승인되었습니다.`);
  } catch(e) {
    if (e.code === 'auth/email-already-in-use') showToast('이미 등록된 아이디입니다.');
    else showToast('승인 중 오류: ' + e.message);
    console.error(e);
  }
};

window.rejectSignup = async function(docId) {
  try {
    await deleteDoc(doc(db, 'signupRequests', docId));
    showToast('가입 신청이 거절되었습니다.');
  } catch(e) { showToast('오류가 발생했습니다.'); }
};

// ===== 일정 승인/반려/삭제 =====
function renderPendingList() {
  const pending = allSchedules.filter(s => s.status === 'pending').sort((a,b) => a.startDate.localeCompare(b.startDate));
  if (pending.length === 0) {
    document.getElementById('pendingList').innerHTML = '<div class="empty-state"><div class="icon">✅</div><p>대기 중인 일정이 없습니다.</p></div>';
    return;
  }
  document.getElementById('pendingList').innerHTML = pending.map(s => {
    const user = allUsers[s.userId] || { nickname: s.userName || '?' };
    return `<div class="pending-item">
      <div class="pending-header">
        <span class="schedule-type-badge type-${s.type}">${s.type}</span>
        <span class="pending-name">${user.nickname || user.name || '?'}</span>
      </div>
      <div class="pending-detail">📅 ${s.startDate} ~ ${s.endDate}${s.note ? `<br>💬 ${s.note}` : ''}</div>
      <div class="pending-actions">
        <button class="btn-lg-approve" onclick="approveSchedule('${s.id}')">✅ 승인</button>
        <button class="btn-lg-reject" onclick="rejectSchedule('${s.id}')">❌ 반려</button>
      </div>
    </div>`;
  }).join('');
}

function renderAllRequests() {
  const all = [...allSchedules].sort((a,b) => b.startDate.localeCompare(a.startDate));
  if (all.length === 0) {
    document.getElementById('allRequests').innerHTML = '<div class="empty-state"><div class="icon">📋</div><p>신청 내역이 없습니다.</p></div>';
    return;
  }
  const statusMap = { pending:'⏳', approved:'✅', rejected:'❌' };
  document.getElementById('allRequests').innerHTML = all.map(s => {
    const user = allUsers[s.userId] || { nickname: s.userName || '?' };
    return `<div class="my-request">
      <span class="schedule-type-badge type-${s.type}">${s.type}</span>
      <div style="flex:1">
        <div class="request-dates">${user.nickname||user.name||'?'} · ${s.startDate} ~ ${s.endDate}</div>
        ${s.note ? `<div class="request-sub">${s.note}</div>` : ''}
      </div>
      <div style="display:flex;gap:4px;align-items:center">
        <span>${statusMap[s.status]}</span>
        <button class="btn-delete" onclick="deleteSchedule('${s.id}')">삭제</button>
      </div>
    </div>`;
  }).join('');
}

function updatePendingBadge() {
  const total = allSchedules.filter(s => s.status === 'pending').length + signupRequests.length;
  const badge = document.getElementById('pendingBadge');
  if (total > 0) { badge.textContent = total; badge.style.display = ''; }
  else { badge.style.display = 'none'; }
}

window.approveSchedule = async function(id) {
  try { await updateDoc(doc(db, 'schedules', id), { status: 'approved' }); showToast('승인되었습니다.'); }
  catch(e) { showToast('오류가 발생했습니다.'); }
};
window.rejectSchedule = async function(id) {
  try { await updateDoc(doc(db, 'schedules', id), { status: 'rejected' }); showToast('반려되었습니다.'); }
  catch(e) { showToast('오류가 발생했습니다.'); }
};
window.deleteSchedule = async function(id) {
  try { await deleteDoc(doc(db, 'schedules', id)); showToast('삭제되었습니다.'); if(selectedDate) showDayDetail(selectedDate); }
  catch(e) { showToast('오류가 발생했습니다.'); }
};

// ===== 취소 모달 =====
window.openCancelModal = function(id) { cancelTargetId = id; document.getElementById('cancelModal').classList.add('show'); };
window.confirmCancel = async function() {
  closeModal('cancelModal');
  if (cancelTargetId) await deleteSchedule(cancelTargetId);
  cancelTargetId = null;
};

// ===== 구성원 목록 (그룹 관리 포함) =====
function renderMemberList() {
  const members = Object.values(allUsers).sort((a,b) => (a.nickname||'').localeCompare(b.nickname||''));
  if (members.length === 0) {
    document.getElementById('memberList').innerHTML = '<div class="empty-state"><p>구성원이 없습니다.</p></div>';
    return;
  }
  const roleLabel = { master:'마스터', manager:'팀장', member:'팀원' };
  const isMaster = currentUserData.role === 'master';
  const isManager = currentUserData.role === 'manager';

  document.getElementById('memberList').innerHTML = members.map(u => {
    const name = u.nickname || u.name || u.userId || '?';
    const group = u.group || 'counselor';
    const groupHtml = isMaster ? `
      <div class="group-toggle">
        <button class="group-btn ${group==='counselor'?'active-counselor':''}" onclick="setGroup('${u.id}','counselor')">상담사</button>
        <button class="group-btn ${group==='other'?'active-other':''}" onclick="setGroup('${u.id}','other')">비상담사</button>
      </div>` :
      `<span style="font-size:12px;color:#5f6368">${group==='counselor'?'상담사':'비상담사'}</span>`;

    return `<div class="member-item">
      <div class="member-info">
        <div class="member-avatar">${name[0]}</div>
        <div>
          <div class="member-name">${name}</div>
          <div class="member-id">@${u.userId || ''}</div>
        </div>
      </div>
      <div class="member-actions">
        ${groupHtml}
        <span class="role-label ${u.role||'member'}">${roleLabel[u.role]||'팀원'}</span>
        ${isMaster && u.id !== currentUser.uid ?
          `<button class="btn-small" onclick="openRoleModal('${u.id}','${u.role||'member'}','${name}')">권한변경</button>` : ''}
      </div>
    </div>`;
  }).join('');
}

window.setGroup = async function(uid, group) {
  try { await updateDoc(doc(db, 'users', uid), { group }); showToast('그룹이 변경되었습니다.'); }
  catch(e) { showToast('오류가 발생했습니다.'); }
};

// ===== 권한 변경 =====
window.openRoleModal = function(uid, role, name) {
  roleTargetId = uid;
  document.getElementById('roleModalName').textContent = `${name}의 권한`;
  document.getElementById('roleSelect').value = role;
  document.getElementById('roleModal').classList.add('show');
};
window.confirmRoleChange = async function() {
  const newRole = document.getElementById('roleSelect').value;
  closeModal('roleModal');
  try { await updateDoc(doc(db, 'users', roleTargetId), { role: newRole }); showToast('권한이 변경되었습니다.'); }
  catch(e) { showToast('오류가 발생했습니다.'); }
  roleTargetId = null;
};

// ===== 커스텀 공휴일 =====
window.addCustomHoliday = async function() {
  const date = document.getElementById('holidayDate').value;
  const name = document.getElementById('holidayName').value.trim();
  if (!date || !name) { showToast('날짜와 사유를 입력하세요.'); return; }
  try {
    await addDoc(collection(db, 'holidays'), { date, name, createdAt: serverTimestamp() });
    showToast('공휴일이 추가되었습니다.');
    document.getElementById('holidayDate').value = '';
    document.getElementById('holidayName').value = '';
  } catch(e) { showToast('오류가 발생했습니다.'); }
};

function renderCustomHolidayList() {
  if (customHolidays.length === 0) {
    document.getElementById('customHolidayList').innerHTML = '<div style="color:#9e9e9e;font-size:14px;padding:10px 0">등록된 커스텀 공휴일이 없습니다.</div>';
    return;
  }
  document.getElementById('customHolidayList').innerHTML = customHolidays.map(h => `
    <div class="holiday-item">
      <div>
        <span class="holiday-date">${h.date}</span>
        <span class="holiday-name-text" style="margin-left:10px">${h.name}</span>
      </div>
      <button class="btn-del-holiday" onclick="deleteHoliday('${h.id}')">🗑</button>
    </div>`).join('');
}

window.deleteHoliday = async function(id) {
  try { await deleteDoc(doc(db, 'holidays', id)); showToast('삭제되었습니다.'); }
  catch(e) { showToast('오류가 발생했습니다.'); }
};

// ===== 탭 전환 =====
window.showTab = function(tab, el) {
  ['calendar','request','admin','members','settings'].forEach(t => {
    document.getElementById('tab-' + t).style.display = t === tab ? '' : 'none';
  });
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  if (el) el.classList.add('active');
};

// ===== 유틸 =====
window.closeModal = function(id) { document.getElementById(id).classList.remove('show'); };

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if(e.target===m) m.classList.remove('show'); });
});

document.getElementById('loginId').addEventListener('keyup', e => {
  if (e.key === 'Enter') document.getElementById('loginPw').focus();
});
</script>
